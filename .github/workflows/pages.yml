name: 构建并发布到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 每天 11:17 北京时间，拉取 giscus 最新评论刷新侧栏
    # 注意：仓库 60 天无 push 等活动后 GitHub 会自动停用定时任务，届时手动 workflow_dispatch 一次即可恢复
    - cron: '17 3 * * *'

permissions:
  contents: read
  discussions: read
  pages: write
  id-token: write

# 同时只跑一个发布任务；新的推送取消排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

env:
  HUGO_VERSION: "0.167.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 用 GITHUB_TOKEN 走认证（匿名请求从共享 runner IP 出去常被 403）；
      # 脚本内部兜底：任何失败保留现有数据并以 0 退出，不会弄坏发布
      - name: 拉取 giscus 最新评论
        run: python3 tools/fetch_latest_activity.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 直接下载官方二进制，不依赖第三方 action，减少长期维护面
      - name: 安装 Hugo
        run: |
          curl -sSL -o /tmp/hugo.tar.gz \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xzf /tmp/hugo.tar.gz -C /tmp hugo
          sudo install -m 0755 /tmp/hugo /usr/local/bin/hugo
          hugo version

      - name: 解析 Pages 地址
        id: pages
        uses: actions/configure-pages@v5

      - name: 构建站点
        run: hugo --minify --gc --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: 校验旧链接
        run: |
          python3 tools/check_links.py || true
          cat recon/linkcheck.txt 2>/dev/null | head -3 || true

      # 硬性门禁：语料里不允许再出现指向原站的绝对地址（老站 2027 年到期）
      - name: 校验没有跳回原站的链接
        run: python3 tools/normalize_links.py --check

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
