baseURL = "https://www.wowotech.net/"
locale = "zh-CN"
defaultContentLanguage = "zh"
title = "蜗窝科技"
enableRobotsTXT = false
disableKinds = ["taxonomy", "term"]
buildFuture = true   # 当天发的文章按 UTC 换算可能是“未来”，必须构建

# 文章/页面的 URL 全部由 front matter 里的 url 决定，与 emlog 原地址一致，
# 因此这里不做任何 permalink 改写，避免外链失效。
[markup.goldmark.renderer]
unsafe = true          # 论坛存档与老文章里含原始 HTML

[markup.highlight]
noClasses = false
lineNos = false
codeFences = true
guessSyntax = false

[markup.tableOfContents]
startLevel = 2
endLevel = 3

[params]
  description = "蜗窝科技 —— 嵌入式 Linux 内核技术笔记与讨论存档"
  author = "蜗窝"
  # 冻结评论的展示开关：历史评论只读展示，不提供发帖入口
  commentsClosedNotice = "以下为原站的历史评论（只读存档）；继续讨论请用上方的评论区。"
  repoURL = "https://github.com/wowotech/wowotech.github.io"

[outputs]
  home = ["HTML", "RSS"]
