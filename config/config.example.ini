; 复制为 config/config.ini 后填入真实值。该文件已被 .gitignore 排除，绝不入库。
; 真实值与线上主机控制台一致。

[ftp]
host = wowotech.gotoftp11.com
user = wowotech
password =
root = /wwwroot

[origin]
; 站点原始地址，用于校验 URL 与抓取
base_url = http://www.wowotech.net

; 源站直连入口：主机商给的解析别名，配合 Host 头可绕过 CDN 的 WAF 限流
; （批量抓取时走 CDN 会被 403，走这里稳定）
fetch_url = http://wowotech.gotoip11.com
fetch_host = www.wowotech.net

[db]
; 源站 MySQL（emlog 与 PunBB 同库）
host = localhost
name = wowotech
user = wowotech
password =

[local]
; 转换产物存放位置（相对仓库根目录）
recon_dir = recon
